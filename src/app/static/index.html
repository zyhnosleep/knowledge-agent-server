<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #f8f8f6;
        --sidebar: #f3f3f1;
        --surface: #ffffff;
        --surface-soft: #eeeeeb;
        --ink: #171717;
        --muted: #73736d;
        --faint: #a2a29b;
        --line: #e1e1dd;
        --accent: #111111;
        --pass: #12734d;
        --warn: #9a6b16;
        --fail: #b83b3b;
        --shadow: 0 18px 48px rgb(17 17 17 / 8%);
        --sidebar-w: 292px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }
      a { color: inherit; text-decoration: none; }

      .shell {
        min-height: 100dvh;
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      }

      .sidebar {
        height: 100dvh;
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 22px 18px;
        border-right: 1px solid var(--line);
        background: var(--sidebar);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: #111;
        color: #fff;
        box-shadow: 0 12px 30px rgb(17 17 17 / 18%);
      }

      .brand strong {
        display: block;
        font-size: 22px;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .brand span,
      .nav small,
      .muted {
        color: var(--muted);
      }

      .workspace {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
      }

      .icon-box {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: var(--surface-soft);
      }

      .nav {
        display: grid;
        gap: 5px;
      }

      .nav button {
        width: 100%;
        display: grid;
        grid-template-columns: 28px 1fr;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--ink);
        text-align: left;
      }

      .nav button:hover,
      .nav button.active {
        background: #fff;
      }

      .nav strong {
        display: block;
        font-size: 14px;
      }

      .nav small {
        display: block;
        font-size: 11px;
      }

      .new-chat {
        margin-top: auto;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        font-weight: 700;
      }

      .profile {
        display: grid;
        grid-template-columns: 34px 1fr;
        align-items: center;
        gap: 10px;
      }

      .profile strong,
      .profile span {
        display: block;
      }

      .avatar {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #5b8cff;
        color: #fff;
        font-weight: 700;
      }

      .main {
        min-width: 0;
        display: grid;
        grid-template-rows: 72px 1fr;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 18px;
        padding: 0 28px;
        border-bottom: 1px solid var(--line);
      }

      .composer textarea {
        border: 0;
        outline: 0;
        background: transparent;
      }

      .status {
        justify-self: end;
        color: var(--pass);
        font-size: 13px;
        font-weight: 700;
      }

      .upload-shortcut {
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fff;
        font-weight: 700;
      }

      .view {
        padding: 34px 28px;
      }

      .view[hidden] { display: none; }

      .chat-view {
        min-height: calc(100dvh - 72px);
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 26px;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 44px);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      .composer {
        width: min(820px, 100%);
        min-height: 66px;
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) auto 48px;
        align-items: center;
        gap: 10px;
        padding: 9px 10px 9px 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        box-shadow: var(--shadow);
      }

      .composer textarea {
        width: 100%;
        min-height: 26px;
        max-height: 120px;
        resize: none;
        font-size: 17px;
      }

      .composer select {
        border: 0;
        background: transparent;
        color: var(--muted);
        outline: 0;
      }

      .send {
        width: 46px;
        height: 46px;
        border: 0;
        border-radius: 999px;
        background: #111;
        color: #fff;
        font-size: 22px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-size: 13px;
      }

      .answer {
        width: min(820px, 100%);
        display: grid;
        gap: 14px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fff;
        box-shadow: var(--shadow);
      }

      .answer[hidden] { display: none; }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .meta span {
        padding: 4px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
      }

      .answer-text {
        white-space: pre-wrap;
        line-height: 1.7;
      }

      .grid-view {
        max-width: 980px;
        display: grid;
        gap: 16px;
      }

      .grid-view h1 {
        margin-bottom: 4px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 12px;
      }

      .card {
        display: grid;
        gap: 10px;
        min-height: 130px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
      }

      .card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 10px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      input[type="text"],
      input[type="file"] {
        width: 100%;
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }

      .button {
        min-height: 42px;
        padding: 0 16px;
        border: 0;
        border-radius: 12px;
        background: #111;
        color: #fff;
        font-weight: 700;
      }

      .log {
        color: var(--muted);
        font-size: 13px;
        white-space: pre-wrap;
      }

      @media (max-width: 900px) {
        .shell { display: block; }
        .sidebar { position: static; height: auto; }
        .topbar { grid-template-columns: 1fr; height: auto; padding: 14px 18px; }
        .status, .upload-shortcut { justify-self: stretch; }
        .composer { grid-template-columns: 30px minmax(0, 1fr) 46px; border-radius: 24px; }
        .composer select { display: none; }
        .cards, .form-row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="mark" aria-hidden="true">◇</div>
          <div>
            <strong>LLM</strong>
            <span>RAG Agent Platform</span>
          </div>
        </div>

        <div class="workspace">
          <div class="icon-box" aria-hidden="true">⌂</div>
          <div>
            <strong>internal-research</strong>
            <div class="muted">当前工作区</div>
          </div>
          <span class="muted">⌄</span>
        </div>

        <nav class="nav" aria-label="主导航">
          <button class="active" type="button" data-view-target="chat"><span>+</span><span><strong>新聊天</strong><small>Agent &amp; RAG Query</small></span></button>
          <button type="button" data-view-target="files"><span>▤</span><span><strong>文档库</strong><small>Upload &amp; Documents</small></span></button>
          <button type="button" data-view-target="runs"><span>◷</span><span><strong>运行</strong><small>Pipeline Runs</small></span></button>
        </nav>

        <button class="new-chat" id="newChatButton" type="button">+ 新建会话</button>

        <div class="profile">
          <div class="avatar">张</div>
          <div><strong>张宇恒</strong><span>Plus</span></div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="status" id="healthStatus">检查服务中</div>
          <button class="upload-shortcut" type="button" data-view-target="files">上传文档</button>
        </header>

        <section class="view chat-view" data-view="chat">
          <h1>今天想验证什么？</h1>

          <form class="composer" id="queryForm">
            <span aria-hidden="true">+</span>
            <textarea id="questionInput" rows="1" placeholder="询问论文、文档或 Agent 能力...">What is the difference between CHARMM36m and CHARMM36?</textarea>
            <select id="queryMode" aria-label="查询模式">
              <option value="agent">Agent</option>
              <option value="rag">普通 RAG</option>
            </select>
            <button class="send" id="sendButton" type="submit" aria-label="发送">↑</button>
          </form>

          <div class="chips">
            <button class="chip" type="button" data-fill-question="什么是 CHARMM36m？">选择话题</button>
            <button class="chip" type="button" data-view-target="files">上传文档</button>
            <button class="chip" type="button" data-view-target="runs">查看运行记录</button>
          </div>

          <article class="answer" id="answerPanel" hidden>
            <div class="meta" id="answerMeta"></div>
            <div class="answer-text" id="answerText"></div>
          </article>
        </section>

        <section class="view grid-view" data-view="files" hidden>
          <h1>文档库</h1>
          <p class="muted">保留项目最小上传入口，对齐当前 internal-research 知识库。</p>
          <form class="card form-row" id="uploadForm">
            <label>Project Slug<input id="projectSlug" type="text" value="internal-research" /></label>
            <label>File<input id="fileInput" type="file" /></label>
            <button class="button" id="uploadButton" type="submit">提交</button>
          </form>
          <div class="card"><strong>状态</strong><div class="log" id="uploadStatus">等待上传。</div></div>
          <div class="card"><strong>最近文档</strong><div class="log" id="documentsBox">loading...</div></div>
        </section>

        <section class="view grid-view" data-view="runs" hidden>
          <h1>运行</h1>
          <p class="muted">Pipeline 运行记录与状态，数据来自 /api/runs。</p>
          <div class="log" id="runsStatus">loading...</div>
          <div class="cards" id="runsCards"></div>
        </section>
      </main>
    </div>

    <script>
      function $(id) { return document.getElementById(id); }

      function setView(name) {
        if (!document.querySelector('[data-view="' + name + '"]')) name = "chat";
        document.querySelectorAll("[data-view]").forEach(function (view) {
          view.hidden = view.dataset.view !== name;
        });
        document.querySelectorAll("[data-view-target]").forEach(function (button) {
          button.classList.toggle("active", button.dataset.viewTarget === name);
        });
        history.replaceState(null, "", "#" + name);
      }

      function showAnswer(meta, text) {
        $("answerPanel").hidden = false;
        $("answerMeta").replaceChildren();
        meta.forEach(function (item) {
          var chip = document.createElement("span");
          chip.textContent = item;
          $("answerMeta").appendChild(chip);
        });
        $("answerText").textContent = text;
      }

      function parseMaybeJson(text) {
        try { return JSON.parse(text); } catch (_) { return text; }
      }

      function fetchJson(url, options) {
        return fetch(url, options).then(function (response) {
          return response.text().then(function (text) {
            var data = parseMaybeJson(text);
            if (!response.ok) throw new Error(data && data.detail ? data.detail : response.statusText);
            return data;
          });
        });
      }

      function parseSSE(chunk) {
        var event = {};
        chunk.split("\n").forEach(function (line) {
          if (line.indexOf("event:") === 0) event.name = line.slice(6).trim();
          if (line.indexOf("data:") === 0) event.data = parseMaybeJson(line.slice(5).trim());
        });
        return event.name ? event : null;
      }

      function runAgent(question) {
        var payload = {
          project_slug: "internal-research",
          query: question,
          session_id: null,
          constraints: { max_steps: 8, max_tool_calls: 5, budget_tokens: 20000, timeout_seconds: 180 }
        };
        return fetch("/api/agent/query/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).then(function (response) {
          if (!response.ok || !response.body) throw new Error("Agent stream failed");
          var reader = response.body.getReader();
          var decoder = new TextDecoder();
          var buffer = "";
          var finalData = null;

          function read() {
            return reader.read().then(function (result) {
              if (result.done) return finalData;
              buffer += decoder.decode(result.value, { stream: true });
              var parts = buffer.split("\n\n");
              buffer = parts.pop() || "";
              parts.forEach(function (part) {
                var event = parseSSE(part);
                if (!event) return;
                if (event.name === "step") {
                  showAnswer(["streaming", event.data.step_type || "step"], event.data.summary || event.data.tool_name || "running");
                }
                if (event.name === "final") finalData = event.data;
              });
              return read();
            });
          }
          return read();
        }).then(function (data) {
          data = data || {};
          var route = data.route && data.route.route ? data.route.route : "agent";
          var citations = data.citations ? data.citations.length : 0;
          showAnswer(
            [data.status || "completed", route, data.provider || data.answer_provider || "provider:auto", citations + " citations"],
            data.final_answer || "(empty)"
          );
        });
      }

      function runRag(question) {
        return fetchJson("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ project_slug: "internal-research", question: question, save_answer: true })
        }).then(function (data) {
          showAnswer(["普通 RAG", data.verification_status || "verification:unknown"], data.answer_markdown || "(empty)");
        });
      }

      document.querySelectorAll("[data-view-target]").forEach(function (button) {
        button.addEventListener("click", function () {
          setView(button.dataset.viewTarget);
        });
      });

      document.querySelectorAll("[data-fill-question]").forEach(function (button) {
        button.addEventListener("click", function () {
          $("questionInput").value = button.dataset.fillQuestion;
          setView("chat");
          $("questionInput").focus();
        });
      });

      $("newChatButton").addEventListener("click", function () {
        setView("chat");
        $("answerPanel").hidden = true;
        $("questionInput").focus();
      });

      $("queryForm").addEventListener("submit", function (event) {
        event.preventDefault();
        var question = $("questionInput").value.trim();
        if (!question) return;
        $("sendButton").disabled = true;
        showAnswer(["running", $("queryMode").value], "正在检索证据并生成回答...");
        var task = $("queryMode").value === "rag" ? runRag(question) : runAgent(question);
        task.catch(function (err) {
          showAnswer(["failed"], err.message || String(err));
        }).finally(function () {
          $("sendButton").disabled = false;
        });
      });

      $("uploadForm").addEventListener("submit", function (event) {
        event.preventDefault();
        var file = $("fileInput").files[0];
        if (!file) {
          $("uploadStatus").textContent = "请先选择文件。";
          return;
        }
        $("uploadStatus").textContent = "上传中...";
        var form = new FormData();
        form.append("file", file);
        fetchJson("/api/ingest/upload?project_slug=" + encodeURIComponent($("projectSlug").value) + "&project_name=Internal%20Research", {
          method: "POST",
          body: form
        }).then(function (data) {
          $("uploadStatus").textContent = "已提交: " + (data.document_id || "-") + " / " + (data.status || "-");
          loadDocuments();
        }).catch(function (err) {
          $("uploadStatus").textContent = "上传失败: " + (err.message || String(err));
        });
      });

      function loadDocuments() {
        fetchJson("/api/documents").then(function (docs) {
          if (!Array.isArray(docs) || !docs.length) {
            $("documentsBox").textContent = "暂无文档。";
            return;
          }
          function isSampleDoc(doc) {
            var name = [doc.file_name, doc.title, doc.id].filter(Boolean).join(" ").toLowerCase();
            return name.indexOf("-sample") >= 0 || name.indexOf("sample") >= 0 || name.indexOf("demo") >= 0;
          }
          var hasOnlySamples = docs.every(function(doc) {
            return isSampleDoc(doc);
          });
          var lines = docs.slice(0, 6).map(function (doc) {
            var isSample = isSampleDoc(doc);
            var label = isSample ? " [sample/demo]" : "";
            return "- " + (doc.title || doc.file_name || doc.id || "document") + " [" + (doc.status || "unknown") + "]" + label;
          });
          if (hasOnlySamples && docs.length > 0) {
            lines.push("\n⚠ 当前仅有示例/演示文档，建议上传包含目标内容的正式文档。");
          }
          $("documentsBox").textContent = lines.join("\n");
        }).catch(function (err) {
          $("documentsBox").textContent = "读取失败: " + (err.message || String(err));
        });
      }

      function loadRuns() {
        fetchJson("/api/runs?limit=10").then(function (runs) {
          $("runsStatus").textContent = "";
          var container = $("runsCards");
          container.replaceChildren();
          if (!Array.isArray(runs) || !runs.length) {
            $("runsStatus").textContent = "暂无运行记录。";
            return;
          }
          $("runsStatus").textContent = "最近 " + runs.length + " 条记录:";
          runs.forEach(function (run) {
            var card = document.createElement("article");
            card.className = "card";
            var statusLabel = run.status || "unknown";
            var color = statusLabel === "completed" ? "var(--pass)" : statusLabel === "failed" ? "var(--fail)" : "var(--warn)";

            var strong = document.createElement("strong");
            strong.textContent = (run.run_type || "run") + " ";
            var statusSpan = document.createElement("span");
            statusSpan.style.color = color;
            statusSpan.textContent = statusLabel;
            strong.appendChild(statusSpan);
            card.appendChild(strong);

            var p = document.createElement("p");
            p.textContent = run.notes || "无备注";
            card.appendChild(p);

            var small = document.createElement("small");
            small.className = "muted";
            small.textContent = (run.created_at || "") + " · " + (run.id || "-");
            card.appendChild(small);

            container.appendChild(card);
          });
        }).catch(function (err) {
          $("runsStatus").textContent = "读取失败: " + (err.message || String(err));
        });
      }

      fetchJson("/api/health").then(function () {
        $("healthStatus").textContent = "所有服务正常";
      }).catch(function () {
        $("healthStatus").textContent = "服务不可达";
        $("healthStatus").style.color = "var(--fail)";
      });

      loadDocuments();
      loadRuns();
      setView((location.hash || "#chat").slice(1));
    </script>
  </body>
</html>
